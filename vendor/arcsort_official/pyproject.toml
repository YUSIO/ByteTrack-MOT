[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcsort"
dynamic = ["version"]
description = "ARC-SORT: uncertainty-adaptive multi-object tracking for fast motion under moving cameras"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Girish Kumar Adari", email = "girish@athlitix.com" }]
requires-python = ">=3.10"
keywords = ["multi-object tracking", "MOT", "sports", "kalman filter", "IMM", "SORT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Core tracker: CPU only, no detector, no deep-learning framework.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "lap>=0.5.12",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Appearance (ReID) features; install a CUDA build of torch for GPU use.
reid = ["torch>=2.1"]
# Visualization (motion-compensated trails use Roboflow trackers) and
# supervision.Detections interop.
viz = ["supervision>=0.26.1", "trackers>=2.6"]
# Evaluation tooling (TrackEval itself is cloned into external/).
eval = ["tqdm"]
# Optional detector backend. Ultralytics is AGPL-3.0: installing it brings
# AGPL obligations for your application. The tracker itself never needs it.
yolo = ["ultralytics>=8.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://athlitix.github.io/arcsort/"
Repository = "https://github.com/Athlitix/arcsort"
Paper = "https://arxiv.org/abs/2610.22306"

[tool.setuptools]
packages = ["arcsort", "arcsort.configs"]

[tool.setuptools.package-data]
"arcsort.configs" = ["*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "arcsort.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
